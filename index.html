<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GOLD SHOP - 開店準備系統</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #5c2c16; color: #fff; margin: 0; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { color: #fce38a; margin-bottom: 5px; }
    .status-bar { font-size: 14px; margin-bottom: 20px; color: #e2b07a; }
    
    .card { background-color: #72381b; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; color: #fce38a; }
    input, select, textarea { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #a45a2a; background-color: #431f0e; color: #fff; }
    
    .btn-group { display: flex; gap: 10px; }
    button { flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-primary { background-color: #e2b07a; color: #431f0e; }
    .btn-primary:hover { background-color: #fce38a; }
    .btn-secondary { background-color: #a45a2a; color: #fff; }
    
    .list-title { color: #fce38a; border-bottom: 1px solid #a45a2a; padding-bottom: 8px; margin-top: 0; }
    .item-card { background: #431f0e; padding: 12px; border-radius: 6px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .item-date { font-size: 12px; color: #e2b07a; }
  </style>
</head>
<body>

<div class="container">
  <h1>GOLD SHOP OPENING PREPARATION</h1>
  <div id="statusText" class="status-bar">🟡 系統讀取中...</div>

  <!-- 新增項目表單 -->
  <div class="card">
    <h3 class="list-title">➕ 新增資料至 Google Sheet</h3>
    <form id="dataForm">
      <div class="form-group">
        <label for="targetSheet">寫入目標工作表</label>
        <select id="targetSheet">
          <option value="工程任務">工程任務</option>
          <option value="採購清單">採購清單</option>
        </select>
      </div>

      <div class="form-group">
        <label for="itemDate">日期</label>
        <input type="date" id="itemDate" required>
      </div>

      <div class="form-group">
        <label for="itemName">項目名稱 / 內容</label>
        <input type="text" id="itemName" placeholder="例如：開工前審批及文件 或 展示櫃燈條" required>
      </div>

      <div class="form-group">
        <label for="itemStatus">狀態 / 備註</label>
        <input type="text" id="itemStatus" placeholder="例如：進行中 / 已完成 / 預算 $5000">
      </div>

      <button type="submit" id="submitBtn" class="btn-primary">同步寫入 Google Sheet</button>
    </form>
  </div>

  <!-- 本地/雲端 檢視列表 -->
  <div class="card">
    <h3 class="list-title">📋 內容快速檢視 (當前頁面資料)</h3>
    <div id="itemList">
      <p style="color: #ccc;">尚無資料，請點擊上方按鈕寫入或更新。</p>
    </div>
  </div>
</div>

<script>
  // 最新部署的 Google Apps Script Web App URL
  const GAS_URL = "https://script.google.com/macros/s/AKfycbzsxEfczDe9FA9g5PqkXNmzjF0DbJm5bu8MPlJz7cgaXk7LZG7kSJhT4ItJOWD83p8E/exec";

  // 預設填入今天日期 (YYYY-MM-DD)
  document.getElementById("itemDate").value = new Date().toISOString().split('T')[0];

  // 處理表單提交 (POST)
  document.getElementById("dataForm").addEventListener("submit", function(e) {
    e.preventDefault();
    
    const submitBtn = document.getElementById("submitBtn");
    const statusText = document.getElementById("statusText");
    
    const sheetType = document.getElementById("targetSheet").value;
    const date = document.getElementById("itemDate").value;
    const name = document.getElementById("itemName").value;
    const status = document.getElementById("itemStatus").value;

    // 將資料打包為橫向陣列 [A欄, B欄, C欄]
    const payload = {
      type: sheetType === "工程任務" ? "task" : "purchase",
      sheet: sheetType,
      data: [date, name, status]
    };

    submitBtn.disabled = true;
    submitBtn.innerText = "同步中...";
    statusText.innerText = "🟡 正在發送資料至 Google 試算表...";

    // POST 請求：注意不可以加 'Content-Type': 'application/json' 以避免 CORS 阻擋
    fetch(GAS_URL, {
      method: "POST",
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(data => {
      if (data.status === "success") {
        statusText.innerText = "🟢 成功寫入至 Google 試算表（工作表：" + sheetType + "）";
        
        // 渲染到前端列表中
        renderItem(date, sheetType, name, status);
        
        // 清空輸入欄位
        document.getElementById("itemName").value = "";
        document.getElementById("itemStatus").value = "";
      } else {
        statusText.innerText = "🔴 寫入失敗: " + (data.message || "未知錯誤");
      }
    })
    .catch(err => {
      console.error(err);
        statusText.innerText = "🔴 雲端連線失敗，請檢查網路或 Apps Script 權限。";
    })
    .finally(() => {
      submitBtn.disabled = false;
      submitBtn.innerText = "同步寫入 Google Sheet";
    });
  });

  // 在前端畫面上動態新增項目的輔助函式
  function renderItem(date, sheet, name, status) {
    const itemList = document.getElementById("itemList");
    
    // 如果是第一筆，先清空預設文字
    if (itemList.querySelector("p")) {
      itemList.innerHTML = "";
    }

    const itemCard = document.createElement("div");
    itemCard.className = "item-card";
    itemCard.innerHTML = `
      <div>
        <div class="item-date">[${sheet}] ${date}</div>
        <strong>${name}</strong>
      </div>
      <div>
        <span style="background: #a45a2a; padding: 4px 8px; border-radius: 4px; font-size: 12px;">${status || "無標籤"}</span>
      </div>
    `;
    itemList.prepend(itemCard);
  }
</script>

</body>
</html>
