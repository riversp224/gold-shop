<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GOLD SHOP - 開店準備系統</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #5c2c16; color: #fff; margin: 0; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { color: #fce38a; margin-bottom: 5px; }
    .status-bar { font-size: 14px; margin-bottom: 20px; color: #e2b07a; padding: 8px; background: rgba(0,0,0,0.2); border-radius: 6px; }
    
    .card { background-color: #72381b; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; color: #fce38a; }
    input, select, textarea { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #a45a2a; background-color: #431f0e; color: #fff; }
    
    button { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-primary { background-color: #e2b07a; color: #431f0e; }
    .btn-primary:hover { background-color: #fce38a; }
    .btn-primary:disabled { background-color: #777; cursor: not-allowed; }
    
    .list-title { color: #fce38a; border-bottom: 1px solid #a45a2a; padding-bottom: 8px; margin-top: 0; display: flex; justify-content: space-between; align-items: center; }
    .item-card { background: #431f0e; padding: 12px; border-radius: 6px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .item-date { font-size: 12px; color: #e2b07a; }
    .refresh-btn { width: auto; padding: 4px 12px; font-size: 12px; background: #a45a2a; color: #fff; border-radius: 4px; }
  </style>
</head>
<body>

<div class="container">
  <h1>GOLD SHOP OPENING PREPARATION</h1>
  <div id="statusText" class="status-bar">🟡 系統讀取雲端資料中...</div>

  <!-- 新增項目表單 -->
  <div class="card">
    <h3 class="list-title">➕ 新增資料至 Google Sheet</h3>
    <form id="dataForm">
      <div class="form-group">
        <label for="targetSheet">寫入目標工作表</label>
        <select id="targetSheet">
          <option value="工程任務">工程任務</option>
          <option value="採購清單">採購清單</option>
        </select>
      </div>

      <div class="form-group">
        <label for="itemDate">日期</label>
        <input type="date" id="itemDate" required>
      </div>

      <div class="form-group">
        <label for="itemName">項目名稱 / 內容</label>
        <input type="text" id="itemName" placeholder="例如：現場施工防護 或 展示櫃燈條" required>
      </div>

      <div class="form-group">
        <label for="itemStatus">狀態 / 備註</label>
        <input type="text" id="itemStatus" placeholder="例如：未完成 / 已完成 / 預算 $5000">
      </div>

      <button type="submit" id="submitBtn" class="btn-primary">同步寫入 Google Sheet</button>
    </form>
  </div>

  <!-- 雲端試算表資料清單 -->
  <div class="card">
    <div class="list-title">
      <span>📋 Google Sheet 雲端項目紀錄</span>
      <button class="refresh-btn" onclick="loadSheetData()">🔄 重新整理</button>
    </div>
    <div id="itemList" style="margin-top: 15px;">
      <p style="color: #ccc;">讀取中...</p>
    </div>
  </div>
</div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbzsxEfczDe9FA9g5PqkXNmzjF0DbJm5bu8MPlJz7cgaXk7LZG7kSJhT4ItJOWD83p8E/exec";

  // 初始化填入今天日期
  document.getElementById("itemDate").value = new Date().toISOString().split('T')[0];

  // 頁面載入時自動讀取雲端資料
  window.addEventListener("DOMContentLoaded", loadSheetData);

  // 讀取 Google Sheet 資料
  function loadSheetData() {
    const statusText = document.getElementById("statusText");
    const itemList = document.getElementById("itemList");
    
    statusText.innerText = "🟡 正在從 Google 試算表載入資料...";
    
    fetch(GAS_URL)
      .then(res => res.json())
      .then(res => {
        if (res.status === "success" && res.data) {
          statusText.innerText = "🟢 資料同步完成";
          renderAllItems(res.data);
        } else {
          statusText.innerText = "🔴 載入失敗: " + (res.message || "未知錯誤");
        }
      })
      .catch(err => {
        console.error(err);
        statusText.innerText = "🔴 讀取失敗，請確認 Apps Script 已更新為「新建版本」。";
      });
  }

  // 將 Google Sheet 所有頁籤資料渲染至前端
  function renderAllItems(allSheetsData) {
    const itemList = document.getElementById("itemList");
    itemList.innerHTML = "";

    let totalItems = 0;

    for (let sheetName in allSheetsData) {
      const rows = allSheetsData[sheetName];
      if (!rows || rows.length === 0) continue;

      rows.forEach((row, index) => {
        // 跳過完全空白列
        if (!row || row.length === 0 || !row[0]) return;

        totalItems++;
        const date = row[0] ? String(row[0]).split("T")[0] : "";
        const name = row[1] || "";
        const status = row[2] || "";

        const itemCard = document.createElement("div");
        itemCard.className = "item-card";
        itemCard.innerHTML = `
          <div>
            <div class="item-date">[${sheetName}] ${date}</div>
            <strong>${name}</strong>
          </div>
          <div>
            <span style="background: #a45a2a; padding: 4px 8px; border-radius: 4px; font-size: 12px;">${status || "無標籤"}</span>
          </div>
        `;
        itemList.prepend(itemCard);
      });
    }

    if (totalItems === 0) {
      itemList.innerHTML = '<p style="color: #ccc;">試算表中尚無資料。</p>';
    }
  }

  // 處理表單提交 (POST 寫入)
  document.getElementById("dataForm").addEventListener("submit", function(e) {
    e.preventDefault();
    
    const submitBtn = document.getElementById("submitBtn");
    const statusText = document.getElementById("statusText");
    
    const sheetType = document.getElementById("targetSheet").value;
    const date = document.getElementById("itemDate").value;
    const name = document.getElementById("itemName").value;
    const status = document.getElementById("itemStatus").value;

    const payload = {
      type: sheetType === "工程任務" ? "task" : "purchase",
      sheet: sheetType,
      data: [date, name, status]
    };

    submitBtn.disabled = true;
    submitBtn.innerText = "同步中...";
    statusText.innerText = "🟡 正在發送資料至 Google 試算表...";

    fetch(GAS_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify(payload)
    })
    .then(() => {
      statusText.innerText = "🟢 已成功寫入 Google 試算表！";
      document.getElementById("itemName").value = "";
      document.getElementById("itemStatus").value = "";
      
      // 延遲 1 秒後重新讀取最新清單
      setTimeout(loadSheetData, 1000);
    })
    .catch(err => {
      console.error(err);
      statusText.innerText = "🔴 發送失敗，請檢查網路連線。";
    })
    .finally(() => {
      submitBtn.disabled = false;
      submitBtn.innerText = "同步寫入 Google Sheet";
    });
  });
</script>

</body>
</html>
